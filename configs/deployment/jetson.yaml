jetson_linux: 36.4.4
cuda: 12.6
cudnn: 9.3
tensorrt: 10.3
input: RGB image in memory
output: CPU-readable detection boxes
include_preprocessing: true
include_data_transfer: true
include_decoding: true
include_postprocessing: true
include_file_reading: false
include_image_decoding: false
