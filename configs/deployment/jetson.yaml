device: Jetson Orin Nano 8GB
input_size: [640, 640]
batch_size: 1
precision: fp16
format: engine
onnx_opset: 17
power_mode: MAXN SUPER
jetson_clocks: true
warmup_iterations_minimum: 200
warmup_seconds_minimum: 5
independent_processes: 3
measurement_images: full_test_split
p95_definition: nearest_rank
cuda_graphs: false
