# Ultralytics YOLO 🚀, AGPL-3.0 license



















[build-system]
requires = ["setuptools>=57.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "ultralytics"
dynamic = ["version"]
description = "AeroGuard: controlled detail transfer and grid-relative geometry learning for visible-light UAV detection."
readme = "README.md"
requires-python = ">=3.10"
license = { "text" = "AGPL-3.0" }
keywords = ["machine-learning", "deep-learning", "computer-vision", "ML", "DL", "AI", "YOLO", "YOLOv3", "YOLOv5", "YOLOv8", "YOLOv9", "YOLOv10", "HUB", "Ultralytics"]
authors = [
    { name = "Glenn Jocher", email = "glenn.jocher@ultralytics.com"},
    { name = "Jing Qiu", email = "jing.qiu@ultralytics.com"},
    { name = "Ayush Chaurasia" }
]
maintainers = [
    { name = "Ultralytics", email = "hello@ultralytics.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]


dependencies = [
    "numpy>=1.23.0,<2.0.0",
    "matplotlib>=3.3.0",
    "opencv-python>=4.6.0",
    "pillow>=7.1.2",
    "pyyaml>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "tqdm>=4.64.0",
    "psutil",
    "py-cpuinfo",
    "pandas>=1.1.4",
    "seaborn>=0.11.0",
    "ultralytics-thop>=2.0.0",
]


[project.optional-dependencies]
dev = [
    "ipython",
    "pytest",
    "pytest-cov",
    "coverage[toml]",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.9",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-redirects",
    "mkdocs-ultralytics-plugin>=0.1.8",
    "mkdocs-macros-plugin>=1.0.5"
]
export = [
    "onnx>=1.12.0",
    "coremltools>=7.0; platform_system != 'Windows' and python_version <= '3.11'",
    "openvino>=2024.0.0",
    "tensorflow>=2.0.0",
    "tensorflowjs>=3.9.0",
    "tensorstore>=0.1.63; platform_machine == 'aarch64' and python_version >= '3.9'",
    "keras",
    "flatbuffers>=23.5.26,<100; platform_machine == 'aarch64'",
    "numpy==1.23.5; platform_machine == 'aarch64'",
    "h5py!=3.11.0; platform_machine == 'aarch64'",
]
explorer = [
    "lancedb",
    "duckdb<=0.9.2",
    "streamlit",
]
logging = [
    "comet",
    "tensorboard>=2.13.0",
    "dvclive>=2.12.0",
]
extra = [
    "hub-sdk>=0.0.12",
    "ipython",
    "albumentations>=1.4.6",
    "pycocotools>=2.0.7",
]

[project.urls]
"Upstream" = "https://github.com/ultralytics/ultralytics/tree/v8.3.0"
"Base framework documentation" = "https://docs.ultralytics.com"

[project.scripts]
yolo = "ultralytics.cfg:entrypoint"
ultralytics = "ultralytics.cfg:entrypoint"


[tool.setuptools]
packages = { find = { where = ["."], include = ["ultralytics", "ultralytics.*"] } }
package-data = { "ultralytics" = ["**/*.yaml", "../tests/*.py"], "ultralytics.assets" = ["*.jpg"] }

[tool.setuptools.dynamic]
version = { attr = "ultralytics.__version__" }

[tool.pytest.ini_options]
addopts = "--durations=20 --color=yes"
markers = [
    "slow: skip slow tests unless --slow is set",
]
norecursedirs = [".git", "dist", "build"]

[tool.coverage.run]
source = ["ultralytics/"]
data_file = "tests/.coverage"
omit = ["ultralytics/utils/callbacks/*"]

[tool.isort]
line_length = 120
multi_line_output = 0

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 2
column_limit = 120
coalesce_brackets = true
spaces_around_power_operator = true
space_between_ending_comma_and_closing_bracket = true
split_before_closing_bracket = false
split_before_first_argument = false

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.docformatter]
wrap-summaries = 120
wrap-descriptions = 120
pre-summary-newline = true
close-quotes-on-newline = true
in-place = true

[tool.codespell]
ignore-words-list = "crate,nd,ned,strack,dota,ane,segway,fo,gool,winn,commend,bloc,nam,afterall"
skip = '*.pt,*.pth,*.torchscript,*.onnx,*.tflite,*.pb,*.bin,*.param,*.mlmodel,*.engine,*.npy,*.data*,*.csv,*pnnx*,*venv*,*translat*,__pycache__*,*.ico,*.jpg,*.png,*.mp4,*.mov,/runs,/.git,./docs/??/*.md,./docs/mkdocs_??.yml'
